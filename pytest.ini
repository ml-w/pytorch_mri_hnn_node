[tool:pytest]
testpaths = mri_node_validator/tests
python_files = test_*.py
python_functions = test_*
python_classes = Test*
addopts = 
    --strict-markers
    --tb=short
    --disable-warnings
markers =
    unit: Unit tests
    integration: Integration tests
    slow: Slow running tests
    gpu: Tests requiring GPU
    data: Tests requiring external data
    visualization: Tests for plotting/visualization
    model: Tests for model components
    training: Tests for training components
    evaluation: Tests for evaluation components
filterwarnings =
    ignore::DeprecationWarning
    ignore::UserWarning:torchio*
    ignore::UserWarning:transformers*
    ignore::FutureWarning